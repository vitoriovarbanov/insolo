<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Horizon mark: the sun's path arcing over a horizon.
       Designed for 16px first — strokes are heavy, the arc is lifted
       clear of the horizon line, and the sun is separated from the
       curve by a knockout ring so the two do not merge when scaled
       down. Hex, not OKLCH: this file sits outside the cascade and is
       parsed by contexts with inconsistent OKLCH support. -->
  <rect width="32" height="32" rx="3" fill="#040d0c"/>
  <path d="M5 21.5 Q16 5.5 27 21.5" fill="none" stroke="#d0763f"
        stroke-width="2.6" stroke-linecap="round"/>
  <!-- knockout: separates the sun from the arc it sits on -->
  <circle cx="16" cy="10.9" r="5.4" fill="#040d0c"/>
  <circle cx="16" cy="10.9" r="3.6" fill="#d0763f"/>
  <line x1="4" y1="25.5" x2="28" y2="25.5" stroke="#3d7a72"
        stroke-width="2.2" stroke-linecap="round"/>
</svg>
