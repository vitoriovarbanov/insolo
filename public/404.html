<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — inSolo</title>
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <meta name="theme-color" content="#040d0c" />
    <!-- Deliberately standalone with inline styles and no bundle: a 404
         has to render even when the main build is broken or missing. -->
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        justify-items: start;
        gap: 1rem;
        padding: 2rem;
        background:
          radial-gradient(
            52rem 22rem at 50% 116%,
            rgba(208, 118, 63, 0.14),
            transparent 68%
          ),
          linear-gradient(180deg, #040d0c, #082019);
        color: #dbe6e3;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .logo {
        height: 2rem;
        width: auto;
        display: block;
        margin-bottom: 0.75rem;
      }
      .code {
        font-family: ui-monospace, 'SF Mono', monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #d0763f;
        margin: 0;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 1rem + 4vw, 3.2rem);
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1;
      }
      p {
        margin: 0;
        color: #8ea6a1;
        max-width: 34ch;
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        padding: 0 1.4rem;
        margin-top: 0.5rem;
        background: #d0763f;
        color: #040d0c;
        text-decoration: none;
        font-family: ui-monospace, 'SF Mono', monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        border-radius: 2px;
      }
      a:hover {
        background: #e89055;
      }
      a:focus-visible {
        outline: 2px solid #dbe6e3;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <a href="/" aria-label="inSolo home"
      ><img
        src="/insolo-logo.png"
        alt="inSolo"
        width="540"
        height="133"
        class="logo"
    /></a>
    <p class="code">Error 404</p>
    <h1>No such page.</h1>
    <p>That address does not exist on this site.</p>
    <a href="/">Back to inSolo</a>
  </body>
</html>
