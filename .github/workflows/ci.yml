name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Build before test: tests/image-budget.test.ts inspects dist/.
      - run: npm run build
        env:
          SITE_URL: https://insolo.vitorio-0405.workers.dev
          INDEXABLE: 'false'

      - run: npm test
